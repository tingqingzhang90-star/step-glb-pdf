<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高级3D模型查看器</title>

    <script src="o3dv/o3dv.min.js"></script>

    <!-- Feather Icons - 使用稳定的 CDN，兼容微信小程序 -->
    <script src="https://cdn.bootcdn.net/ajax/libs/feather-icons/4.29.0/feather.min.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            /* 真实的中性色系统 - 参考专业软件 */
            --gray-50: #fafafa;
            --gray-100: #f5f5f5;
            --gray-200: #eeeeee;
            --gray-300: #e0e0e0;
            --gray-400: #bdbdbd;
            --gray-500: #9e9e9e;
            --gray-600: #757575;
            --gray-700: #616161;
            --gray-800: #424242;
            --gray-850: #303030;
            --gray-900: #212121;
            --gray-950: #1a1a1a;

            /* 低饱和度的主题色 - 专业蓝 */
            --primary-50: #e3f2fd;
            --primary-100: #bbdefb;
            --primary-200: #90caf9;
            --primary-300: #64b5f6;
            --primary-400: #42a5f5;
            --primary-500: #2196f3;
            --primary-600: #1e88e5;
            --primary-700: #1976d2;
            --primary-800: #1565c0;
            --primary-900: #0d47a1;

            /* 真实的阴影系统 */
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 2px 4px 0 rgba(0, 0, 0, 0.08);
            --shadow-lg: 0 4px 8px 0 rgba(0, 0, 0, 0.12);
            --shadow-xl: 0 8px 16px 0 rgba(0, 0, 0, 0.16);

            /* 背景层级 */
            --bg-canvas: #1a1a1a;
            --bg-surface: #212121;
            --bg-elevated: #2a2a2a;
            --bg-overlay: #303030;

            /* 边框 */
            --border-subtle: rgba(255, 255, 255, 0.08);
            --border-normal: rgba(255, 255, 255, 0.12);
            --border-strong: rgba(255, 255, 255, 0.16);

            /* 文字 */
            --text-primary: #e0e0e0;
            --text-secondary: #9e9e9e;
            --text-tertiary: #757575;
            --text-disabled: #616161;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica Neue', Arial, sans-serif;
            background: var(--bg-canvas);
            color: var(--text-primary);
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .app {
            display: flex;
            height: 100vh;
        }

        /* 侧边栏 */
        .sidebar {
            width: 320px;
            background: var(--bg-surface);
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border-normal);
            box-shadow: var(--shadow-lg);
        }

        .sidebar-header {
            padding: 20px 24px;
            background: var(--bg-elevated);
            border-bottom: 1px solid var(--border-normal);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .sidebar-header .logo {
            width: 36px;
            height: 36px;
            background: var(--primary-700);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            box-shadow: var(--shadow-md);
        }

        .sidebar-header .logo i {
            width: 20px;
            height: 20px;
            stroke: white;
            stroke-width: 2.5;
        }

        .sidebar-header .header-text {
            flex: 1;
        }

        .sidebar-header h1 {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 2px;
            letter-spacing: -0.01em;
        }

        .sidebar-header p {
            font-size: 11px;
            opacity: 0.65;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .lang-toggle {
            width: 32px;
            height: 32px;
            border: 1px solid var(--border-normal);
            border-radius: 6px;
            background: var(--bg-elevated);
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 11px;
            font-weight: 600;
            transition: all 0.15s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .lang-toggle:hover {
            background: var(--bg-overlay);
            border-color: var(--border-strong);
            color: var(--text-primary);
        }

        .lang-toggle:active {
            background: var(--bg-elevated);
        }

        .sidebar-content {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .section {
            margin-bottom: 24px;
        }

        .section-title {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            color: var(--text-secondary);
            margin-bottom: 12px;
            letter-spacing: 0.8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-title i {
            width: 14px;
            height: 14px;
            stroke-width: 2.5;
        }

        .file-upload {
            border: 2px dashed var(--border-normal);
            border-radius: 8px;
            padding: 24px;
            text-align: center;
            cursor: pointer;
            transition: all 0.15s ease;
            background: var(--bg-canvas);
        }

        .file-upload:hover {
            border-color: var(--border-strong);
            background: var(--bg-elevated);
        }

        .file-upload.dragover {
            border-color: var(--primary-600);
            border-style: solid;
            background: color-mix(in srgb, var(--primary-600) 8%, var(--bg-elevated));
        }

        .file-upload input {
            display: none;
        }

        .upload-icon {
            width: 48px;
            height: 48px;
            margin: 0 auto 16px;
            stroke: var(--primary-600);
            stroke-width: 1.5;
        }

        .upload-text {
            font-size: 13px;
            color: var(--text-secondary);
            line-height: 1.6;
        }

        .upload-text strong {
            color: var(--text-primary);
            font-weight: 500;
        }

        .control-group {
            margin-bottom: 16px;
        }

        .control-label {
            display: block;
            font-size: 13px;
            margin-bottom: 8px;
            color: var(--text-primary);
        }

        .btn {
            width: 100%;
            padding: 11px 16px;
            border: 1px solid var(--border-normal);
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s ease;
            background: var(--bg-elevated);
            color: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: var(--shadow-sm);
        }

        .btn i {
            width: 16px;
            height: 16px;
            stroke-width: 2.5;
        }

        .btn:hover:not(:disabled) {
            background: var(--bg-overlay);
            border-color: var(--border-strong);
        }

        .btn:active:not(:disabled) {
            background: var(--bg-elevated);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-primary {
            background: var(--primary-700);
            border-color: var(--primary-700);
            color: white;
            box-shadow: var(--shadow-sm);
        }

        .btn-primary:hover:not(:disabled) {
            background: var(--primary-600);
            border-color: var(--primary-600);
        }

        .btn-primary:active:not(:disabled) {
            background: var(--primary-800);
            border-color: var(--primary-800);
        }

        select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border-normal);
            border-radius: 6px;
            background: var(--bg-canvas);
            color: var(--text-primary);
            font-size: 14px;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        select:hover {
            border-color: var(--border-strong);
            background: var(--bg-elevated);
        }

        select:focus {
            outline: none;
            border-color: var(--primary-600);
            box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary-600) 15%, transparent);
        }

        select option {
            background: var(--bg-surface);
            color: var(--text-primary);
            padding: 8px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .stat-card {
            background: var(--bg-elevated);
            padding: 16px;
            border-radius: 8px;
            border: 1px solid var(--border-normal);
            box-shadow: var(--shadow-sm);
            transition: all 0.15s ease;
        }

        .stat-card:hover {
            border-color: var(--border-strong);
        }

        .stat-value {
            font-size: 24px;
            font-weight: 600;
            color: var(--primary-500);
            margin-bottom: 4px;
        }

        .stat-label {
            font-size: 12px;
            color: var(--text-secondary);
            font-weight: 500;
            letter-spacing: 0.3px;
        }

        .view-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 12px;
        }

        .view-btn {
            padding: 10px;
            border: 1px solid var(--border-normal);
            border-radius: 6px;
            background: var(--bg-elevated);
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
            transition: all 0.15s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            box-shadow: var(--shadow-sm);
        }

        .view-btn i {
            width: 14px;
            height: 14px;
            stroke-width: 2.5;
        }

        .view-btn:hover {
            background: var(--bg-overlay);
            border-color: var(--border-strong);
            color: var(--text-primary);
        }

        .view-btn:active {
            background: var(--bg-elevated);
        }

        /* 选中状态 */
        .view-btn.active {
            background: var(--primary-700);
            border-color: var(--primary-700);
            color: white;
        }

        /* 主视图区域 */
        .main-view {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .toolbar {
            padding: 16px 24px;
            background: var(--bg-surface);
            border-bottom: 1px solid var(--border-normal);
            display: flex;
            gap: 12px;
            align-items: center;
            box-shadow: var(--shadow-sm);
        }

        .toolbar-btn {
            padding: 9px 14px;
            border: 1px solid var(--border-normal);
            border-radius: 6px;
            background: var(--bg-elevated);
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.15s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: var(--shadow-sm);
        }

        .toolbar-btn i {
            width: 16px;
            height: 16px;
            stroke-width: 2.5;
        }

        .toolbar-btn:hover:not(:disabled) {
            background: var(--bg-overlay);
            border-color: var(--border-strong);
            color: var(--text-primary);
        }

        .toolbar-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .toolbar-btn.file-name {
            background: transparent;
            border-color: transparent;
            cursor: default;
        }

        .toolbar-btn.file-name:hover {
            background: transparent;
            border-color: transparent;
        }

        /* 移动端菜单按钮 */
        .menu-toggle {
            display: none;
            padding: 9px 14px;
            border: 1px solid var(--border-normal);
            border-radius: 6px;
            background: var(--bg-elevated);
            color: var(--text-secondary);
            cursor: pointer;
            box-shadow: var(--shadow-sm);
        }

        .menu-toggle i {
            width: 20px;
            height: 20px;
            stroke-width: 2.5;
        }

        .menu-toggle:hover {
            background: var(--bg-overlay);
            border-color: var(--border-strong);
            color: var(--text-primary);
        }

        .spacer {
            flex: 1;
        }

        .viewer-area {
            flex: 1;
            position: relative;
            background: var(--bg-canvas);
        }

        .viewer-container {
            width: 100%;
            height: 100%;
        }

        .empty-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            background: color-mix(in srgb, var(--bg-canvas) 80%, transparent);
        }

        .empty-overlay.hidden {
            display: none;
        }

        .empty-content {
            text-align: center;
            color: var(--text-tertiary);
        }

        .empty-icon {
            font-size: 80px;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        .empty-content h2 {
            font-size: 24px;
            margin-bottom: 8px;
            color: var(--text-secondary);
        }

        .empty-content p {
            font-size: 14px;
        }

        /* 加载动画 */
        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: color-mix(in srgb, var(--bg-canvas) 95%, transparent);
            backdrop-filter: blur(4px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .loading-overlay.active {
            display: flex;
            animation: fadeIn 0.2s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .loader {
            text-align: center;
            background: var(--bg-surface);
            padding: 32px 48px;
            border-radius: 12px;
            border: 1px solid var(--border-normal);
            box-shadow: var(--shadow-xl);
        }

        .spinner {
            border: 3px solid var(--border-normal);
            border-top: 3px solid var(--primary-600);
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loader p {
            color: var(--text-primary);
            font-size: 14px;
            font-weight: 500;
        }

        /* 响应式 - 平板设备 */
        @media (max-width: 1024px) {
            .sidebar {
                width: 280px;
            }
        }

        /* 响应式 - 移动端 */
        @media (max-width: 768px) {
            /* 侧边栏 */
            .sidebar {
                position: fixed;
                left: -100%;
                width: 85vw;
                max-width: 320px;
                height: 100vh;
                z-index: 1001;
                transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
                box-shadow: 2px 0 16px rgba(0, 0, 0, 0.5);
            }

            .sidebar.open {
                left: 0;
            }

            /* 侧边栏头部 */
            .sidebar-header {
                padding: 16px 20px;
            }

            .sidebar-header h1 {
                font-size: 15px;
            }

            .sidebar-header p {
                font-size: 10px;
            }

            .sidebar-header .logo {
                width: 32px;
                height: 32px;
            }

            .sidebar-header .logo i {
                width: 18px;
                height: 18px;
            }

            /* 侧边栏内容 */
            .sidebar-content {
                padding: 16px;
            }

            .section {
                margin-bottom: 20px;
            }

            .section-title {
                font-size: 10px;
                margin-bottom: 10px;
            }

            /* 文件上传区域 */
            .file-upload {
                padding: 20px 16px;
            }

            .upload-icon {
                width: 40px;
                height: 40px;
                margin-bottom: 12px;
            }

            .upload-text {
                font-size: 12px;
            }

            /* 控件 */
            .control-label {
                font-size: 12px;
                margin-bottom: 6px;
            }

            .btn {
                padding: 10px 14px;
                font-size: 12px;
            }

            .btn i {
                width: 15px;
                height: 15px;
            }

            select {
                padding: 9px 11px;
                font-size: 13px;
            }

            /* 视角按钮 */
            .view-buttons {
                gap: 6px;
                margin-bottom: 10px;
            }

            .view-btn {
                padding: 8px;
                font-size: 11px;
            }

            .view-btn i {
                width: 13px;
                height: 13px;
            }

            /* 统计卡片 */
            .stats-grid {
                grid-template-columns: 1fr 1fr;
                gap: 10px;
            }

            .stat-card {
                padding: 12px;
            }

            .stat-value {
                font-size: 20px;
                margin-bottom: 3px;
            }

            .stat-label {
                font-size: 11px;
            }

            /* 工具栏 */
            .toolbar {
                padding: 12px 16px;
                gap: 8px;
            }

            .toolbar-btn {
                padding: 8px 12px;
                font-size: 12px;
            }

            .toolbar-btn i {
                width: 15px;
                height: 15px;
            }

            /* 隐藏工具栏文件名（移动端空间有限）*/
            .toolbar-btn.file-name {
                display: none;
            }

            /* 菜单按钮 */
            .menu-toggle {
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 8px 12px;
            }

            .menu-toggle i {
                width: 18px;
                height: 18px;
            }

            /* 空状态 */
            .empty-icon {
                font-size: 60px;
                margin-bottom: 12px;
            }

            .empty-content h2 {
                font-size: 20px;
                margin-bottom: 6px;
            }

            .empty-content p {
                font-size: 13px;
            }

            /* 加载动画 */
            .loader {
                padding: 24px 36px;
            }

            .spinner {
                width: 40px;
                height: 40px;
                margin-bottom: 12px;
            }

            .loader p {
                font-size: 13px;
            }

            /* 遮罩层 */
            .sidebar-overlay {
                display: none;
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                background: rgba(0, 0, 0, 0.6);
                backdrop-filter: blur(2px);
                z-index: 1000;
                opacity: 0;
                transition: opacity 0.3s ease;
            }

            .sidebar-overlay.active {
                display: block;
                opacity: 1;
            }
        }

        /* 响应式 - 小屏手机 */
        @media (max-width: 480px) {
            .sidebar {
                width: 90vw;
                max-width: none;
            }

            .sidebar-header h1 {
                font-size: 14px;
            }

            .sidebar-content {
                padding: 12px;
            }

            .section {
                margin-bottom: 16px;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }

            .stat-card {
                padding: 10px;
            }

            .stat-value {
                font-size: 18px;
            }

            .toolbar {
                padding: 10px 12px;
            }

            .toolbar-btn:not(.menu-toggle):not(:first-child) {
                padding: 8px;
            }

            .toolbar-btn span {
                display: none;
            }

            .toolbar-btn i {
                margin: 0;
            }
        }

        /* 横屏优化 */
        @media (max-width: 768px) and (orientation: landscape) {
            .sidebar {
                width: 60vw;
                max-width: 280px;
            }

            .sidebar-content {
                padding: 12px 16px;
            }

            .section {
                margin-bottom: 16px;
            }

            .file-upload {
                padding: 16px;
            }

            .upload-icon {
                width: 36px;
                height: 36px;
                margin-bottom: 10px;
            }
        }
    </style>
</head>
<body>
    <!-- 移动端遮罩层 -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <div class="app">
        <!-- 侧边栏 -->
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <i data-feather="box"></i>
                </div>
                <div class="header-text">
                    <h1 data-i18n="app.title">3D Viewer Pro</h1>
                    <p data-i18n="app.subtitle">Professional Tool</p>
                </div>
                <button class="lang-toggle" id="langToggle" title="Switch Language">EN</button>
            </div>

            <div class="sidebar-content">
                <!-- 文件上传 -->
                <div class="section">
                    <div class="section-title">
                        <i data-feather="upload"></i>
                        <span data-i18n="section.loadModel">Load Model</span>
                    </div>
                    <div class="file-upload" id="fileUpload">
                        <input type="file" id="fileInput" multiple accept=".obj,.stl,.gltf,.glb,.ply,.off,.3ds,.fbx,.step,.stp,.iges,.igs,.brep,.brp,.ifc,.fcstd,.3dm,.dae,.wrl,.3mf,.amf">
                        <i data-feather="package" class="upload-icon"></i>
                        <div class="upload-text">
                            <strong data-i18n="upload.dragDrop">Click or drag files</strong><br>
                            <span data-i18n="upload.formats">OBJ, STL, GLTF, PLY, STEP, IGES, IFC</span>
                        </div>
                    </div>
                </div>

                <!-- 相机视角 -->
                <div class="section">
                    <div class="section-title">
                        <i data-feather="camera"></i>
                        <span data-i18n="section.camera">Camera View</span>
                    </div>
                    <div class="view-buttons">
                        <button class="view-btn" data-view="front">
                            <i data-feather="arrow-up"></i>
                            <span data-i18n="camera.front">Front</span>
                        </button>
                        <button class="view-btn" data-view="back">
                            <i data-feather="arrow-down"></i>
                            <span data-i18n="camera.back">Back</span>
                        </button>
                        <button class="view-btn" data-view="left">
                            <i data-feather="arrow-left"></i>
                            <span data-i18n="camera.left">Left</span>
                        </button>
                        <button class="view-btn" data-view="right">
                            <i data-feather="arrow-right"></i>
                            <span data-i18n="camera.right">Right</span>
                        </button>
                        <button class="view-btn" data-view="top">
                            <i data-feather="chevron-up"></i>
                            <span data-i18n="camera.top">Top</span>
                        </button>
                        <button class="view-btn" data-view="bottom">
                            <i data-feather="chevron-down"></i>
                            <span data-i18n="camera.bottom">Bottom</span>
                        </button>
                    </div>
                    <div class="control-group">
                        <button class="btn" id="resetCameraBtn" disabled>
                            <i data-feather="rotate-ccw"></i>

        // 国际化文本

        };

        // 微信环境检测
        function isWeChat() {
            return /MicroMessenger/i.test(navigator.userAgent);
        }

        function isWeChatMiniProgram() {
            return new Promise((resolve) => {
                if (!isWeChat()) {
                    resolve(false);
                    return;
                }
                // 检测是否在小程序 WebView 中
                if (window.__wxjs_environment === 'miniprogram') {
                    resolve(true);
                } else if (typeof wx !== 'undefined' && wx.miniProgram) {
                    wx.miniProgram.getEnv((res) => {
                        resolve(res.miniprogram);
                    });
                } else {
                    resolve(false);
                }
            });
        }

        // WebGL 能力检测
        function checkWebGLSupport() {
            try {
                const canvas = document.createElement('canvas');
                const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
                if (!gl) {
                    return { supported: false, error: 'WebGL 不可用' };
                }

                // 检查必要的扩展
                const maxTextureSize = gl.getParameter(gl.MAX_TEXTURE_SIZE);
                const maxVertexAttribs = gl.getParameter(gl.MAX_VERTEX_ATTRIBS);

                console.log('WebGL 信息:', {
                    renderer: gl.getParameter(gl.RENDERER),
                    vendor: gl.getParameter(gl.VENDOR),
                    version: gl.getParameter(gl.VERSION),
                    maxTextureSize: maxTextureSize,
                    maxVertexAttribs: maxVertexAttribs
                });

                return {
                    supported: true,
                    info: {
                        maxTextureSize,
                        maxVertexAttribs
                    }
                };
            } catch (e) {
                return { supported: false, error: e.message };
            }
        }

        // 页面加载完成
        window.addEventListener('load', async () => {
            // 检测微信小程序环境
            const inMiniProgram = await isWeChatMiniProgram();
            if (inMiniProgram) {
                console.log('✅ 检测到微信小程序环境');
                // 可以添加特殊处理
                document.body.classList.add('wechat-miniprogram');
            }

            // 检测 WebGL 支持
            const webglCheck = checkWebGLSupport();
            if (!webglCheck.supported) {
                alert('错误：您的设备不支持 WebGL\n' + webglCheck.error + '\n\n3D 模型查看器需要 WebGL 支持才能运行。');
                return;
            }
            console.log('✅ WebGL 支持正常');

            // 检查 OV 库是否加载
            if (typeof OV === 'undefined') {
                alert('错误：Online 3D Viewer 库未加载！\n请确保已运行：\nnpm install\nnpm run build_dev');
                return;
            }
            console.log('✅ OV 库加载成功');

            // 初始化 Feather Icons（带容错）
            if (typeof feather !== 'undefined') {
                feather.replace();
                console.log('✅ Feather Icons 初始化成功');
            } else {
                console.warn('⚠️ Feather Icons 未加载，图标可能无法显示');
            }

            // 初始化语言
            initLanguage();

            // 初始化背景颜色
            bgColors = {
                dark: new OV.RGBAColor(15, 20, 25, 255),
                light: new OV.RGBAColor(248, 249, 250, 255),
                gray: new OV.RGBAColor(128, 128, 128, 255),
                black: new OV.RGBAColor(0, 0, 0, 255)
            };

            initViewer();
            initEventListeners();
            initMobileMenu();
            
            // 检查URL参数，自动加载模型
            loadModelFromUrl();
        });

        // 初始化语言
        function initLanguage() {
            // 从 localStorage 读取保存的语言偏好
            const savedLang = localStorage.getItem('preferred-language');
            if (savedLang && i18n[savedLang]) {
                currentLanguage = savedLang;
                console.log(`✓ 使用已保存的语言偏好: ${savedLang}`);
            } else {
                // 智能检测用户地区和语言
                currentLanguage = detectUserLanguage();
                console.log(`✓ 自动检测语言: ${currentLanguage}`);
            }
            updateLanguage();
        }

        // 智能检测用户语言和地区
        function detectUserLanguage() {
            // 1. 检测浏览器语言（最准确）
            const languages = navigator.languages || [navigator.language || navigator.userLanguage];
            console.log('🌍 浏览器语言列表:', languages);

            // 2. 检测时区（辅助判断）
            const timezone = Intl.DateTimeFormat().resolvedOptions().timeZone;
            console.log('🕐 用户时区:', timezone);

            // 3. 检测地区格式
            const locale = navigator.language || navigator.userLanguage || 'en-US';
            console.log('📍 用户地区:', locale);

            // 中文地区列表
            const chineseRegions = [
                'zh',      // 中文（通用）
                'zh-CN',   // 中国大陆（简体中文）
                'zh-SG',   // 新加坡（简体中文）
                'zh-TW',   // 台湾（繁体中文）
                'zh-HK',   // 香港（繁体中文）
                'zh-MO',   // 澳门（繁体中文）
                'zh-Hans', // 简体中文
                'zh-Hant'  // 繁体中文
            ];

            // 中国时区列表
            const chineseTimezones = [
                'Asia/Shanghai',
                'Asia/Hong_Kong',
                'Asia/Taipei',
                'Asia/Macau',
                'Asia/Chongqing',
                'Asia/Urumqi'
            ];

            // 优先级1：检查浏览器语言列表
            for (const lang of languages) {
                const langLower = lang.toLowerCase();

                // 精确匹配中文地区
                if (chineseRegions.some(region => langLower.startsWith(region.toLowerCase()))) {
                    console.log(`✓ 通过浏览器语言检测到中文: ${lang}`);
                    return 'zh';
                }
            }

            // 优先级2：检查时区（中国时区）
            if (chineseTimezones.includes(timezone)) {
                console.log(`✓ 通过时区检测到中国地区: ${timezone}`);
                return 'zh';
            }

            // 优先级3：检查地区代码
            const localeCountry = locale.split('-')[1]?.toUpperCase();
            const chineseCountries = ['CN', 'SG', 'TW', 'HK', 'MO'];
            if (localeCountry && chineseCountries.includes(localeCountry)) {
                console.log(`✓ 通过地区代码检测到中文地区: ${localeCountry}`);
                return 'zh';
            }

            // 默认返回英文
            console.log('→ 使用默认语言: en');
            return 'en';
        }

        // 切换语言
        function toggleLanguage() {
            const oldLang = currentLanguage;
            currentLanguage = currentLanguage === 'en' ? 'zh' : 'en';
            localStorage.setItem('preferred-language', currentLanguage);
            console.log(`🔄 语言切换: ${oldLang} → ${currentLanguage}`);
            updateLanguage();

            // 显示切换提示（可选）
            showLanguageToast();
        }

        // 显示语言切换提示
        function showLanguageToast() {
            const message = currentLanguage === 'zh' ? '已切换到中文' : 'Switched to English';

            // 创建提示元素
            const toast = document.createElement('div');
            toast.textContent = message;
            toast.style.cssText = `
                position: fixed;
                top: 80px;
                left: 50%;
                transform: translateX(-50%);
                background: var(--bg-overlay);
                color: var(--text-primary);
                padding: 12px 24px;
                border-radius: 8px;
                border: 1px solid var(--border-normal);
                font-size: 14px;
                font-weight: 500;
                z-index: 10000;
                box-shadow: var(--shadow-xl);
                animation: slideDown 0.3s ease;
            `;

            document.body.appendChild(toast);

            // 3秒后移除
            setTimeout(() => {
                toast.style.animation = 'slideUp 0.3s ease';
                setTimeout(() => {
                    document.body.removeChild(toast);
                }, 300);
            }, 2000);
        }

        // 添加动画样式
        if (!document.querySelector('#toast-animations')) {
            const style = document.createElement('style');
            style.id = 'toast-animations';
            style.textContent = `
                @keyframes slideDown {
                    from {
                        opacity: 0;
                        transform: translateX(-50%) translateY(-20px);
                    }
                    to {
                        opacity: 1;
                        transform: translateX(-50%) translateY(0);
                    }
                }
                @keyframes slideUp {
                    from {
                        opacity: 1;
                        transform: translateX(-50%) translateY(0);
                    }
                    to {
                        opacity: 0;
                        transform: translateX(-50%) translateY(-20px);
                    }
                }
            `;
            document.head.appendChild(style);
        }

        // 更新界面语言
        function updateLanguage() {
            const texts = i18n[currentLanguage];

            // 更新所有带 data-i18n 属性的元素
            document.querySelectorAll('[data-i18n]').forEach(element => {
                const key = element.getAttribute('data-i18n');
                const keys = key.split('.');
                let value = texts;

                // 递归获取嵌套的翻译文本
                for (const k of keys) {
                    value = value[k];
                    if (!value) break;
                }

                if (value) {
                    element.textContent = value;
                }
            });

            // 更新语言切换按钮
            const langToggle = document.getElementById('langToggle');
            if (langToggle) {
                langToggle.textContent = currentLanguage === 'en' ? 'EN' : '中';
                langToggle.title = currentLanguage === 'en' ? 'Switch to Chinese / 切换到中文' : 'Switch to English / 切换到英文';
            }

            // 更新 HTML lang 属性
            document.documentElement.lang = currentLanguage === 'zh' ? 'zh-CN' : 'en';

            // 重新初始化 Feather Icons
            feather.replace();

            console.log(`✓ 界面语言已更新为: ${currentLanguage === 'zh' ? '中文' : 'English'}`);
        }

        // 初始化查看器
        function initViewer() {
            const container = document.getElementById('viewerContainer');

            // 微信小程序环境优化配置
            const isMiniProgram = document.body.classList.contains('wechat-miniprogram');

            const viewerConfig = {
                backgroundColor: new OV.RGBAColor(15, 20, 25, 255),
                defaultColor: new OV.RGBColor(200, 200, 200),
                edgeSettings: new OV.EdgeSettings(false, new OV.RGBColor(0, 0, 0), 1),
                onModelLoaded: () => {
                    // 清除加载超时
                    if (window._currentLoadTimeout) {
                        clearTimeout(window._currentLoadTimeout);
                        window._currentLoadTimeout = null;
                    }

                    hideEmptyState();
                    currentModel = viewer.GetModel();
                    updateModelStats();
                    enableControls();
                    hideLoading();

                    // 微信环境下的额外日志
                    if (isMiniProgram) {
                        console.log('✅ 模型在微信小程序中加载成功');
                    }
                }
            };

            try {
                viewer = new OV.EmbeddedViewer(container, viewerConfig);
                console.log('✅ Viewer 初始化成功');

                // 内存监控（仅开发环境）
                if (isMiniProgram && performance.memory) {
                    console.log('📊 内存使用情况:', {
                        used: (performance.memory.usedJSHeapSize / 1024 / 1024).toFixed(2) + 'MB',
                        total: (performance.memory.totalJSHeapSize / 1024 / 1024).toFixed(2) + 'MB',
                        limit: (performance.memory.jsHeapSizeLimit / 1024 / 1024).toFixed(2) + 'MB'
                    });
                }
            } catch (error) {
                console.error('❌ Viewer 初始化失败:', error);
                alert('3D 查看器初始化失败：\n' + error.message);
            }
        }

        // 初始化事件监听
        function initEventListeners() {
            const fileInput = document.getElementById('fileInput');
            const fileUpload = document.getElementById('fileUpload');

            // 文件选择
            fileInput.addEventListener('change', (e) => {
                if (e.target.files.length > 0) {
                    loadModel(e.target.files);
                }
            });

            // 点击上传区域
            fileUpload.addEventListener('click', () => {
                fileInput.click();
            });

            // 拖拽上传
            fileUpload.addEventListener('dragover', (e) => {
                e.preventDefault();
                fileUpload.classList.add('dragover');
            });

            fileUpload.addEventListener('dragleave', () => {
                fileUpload.classList.remove('dragover');
            });

            fileUpload.addEventListener('drop', (e) => {
                e.preventDefault();
                fileUpload.classList.remove('dragover');
                if (e.dataTransfer.files.length > 0) {
                    loadModel(e.dataTransfer.files);
                }
            });

            // 背景颜色
            document.getElementById('bgColorSelect').addEventListener('change', (e) => {
                const color = bgColors[e.target.value];
                if (color && viewer) {
                    try {
                        const innerViewer = viewer.GetViewer();
                        if (innerViewer && innerViewer.SetBackgroundColor) {
                            innerViewer.SetBackgroundColor(color);
                        }
                    } catch (error) {
                        console.log('背景色设置失败');
                    }
                }
            });

            // 截图按钮
            document.getElementById('screenshotBtn').addEventListener('click', takeScreenshot);
            document.getElementById('toolbarScreenshotBtn').addEventListener('click', takeScreenshot);

            // 重置视图
            document.getElementById('resetViewBtn').addEventListener('click', resetView);
            document.getElementById('toolbarResetBtn').addEventListener('click', resetView);

            // 全屏
            document.getElementById('fullscreenBtn').addEventListener('click', toggleFullscreen);

            // 相机视角按钮
            document.querySelectorAll('.view-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    setCameraView(btn.dataset.view);
                });
            });

            // 重置相机
            document.getElementById('resetCameraBtn').addEventListener('click', resetCamera);

            // 投影模式
            document.getElementById('projectionSelect').addEventListener('change', (e) => {
                setProjectionMode(e.target.value);
            });

            // 语言切换
            document.getElementById('langToggle').addEventListener('click', toggleLanguage);
        }

        // 初始化移动端菜单
        function initMobileMenu() {
            const menuToggle = document.getElementById('menuToggle');
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');

            // 切换侧边栏
            menuToggle.addEventListener('click', () => {
                sidebar.classList.toggle('open');
                overlay.classList.toggle('active');
            });

            // 点击遮罩关闭
            overlay.addEventListener('click', () => {
                sidebar.classList.remove('open');
                overlay.classList.remove('active');
            });

            // 加载文件后自动关闭（移动端）
            const originalLoadModel = window.loadModel;
            window.loadModel = function(...args) {
                originalLoadModel.apply(this, args);
                if (window.innerWidth <= 768) {
                    setTimeout(() => {
                        sidebar.classList.remove('open');
                        overlay.classList.remove('active');
                    }, 500);
                }
            };
        }

        // 加载模型
        function loadModel(files) {
            if (!viewer || !files || files.length === 0) return;

            try {
                // 检查文件大小（微信环境建议限制）
                const isMiniProgram = document.body.classList.contains('wechat-miniprogram');
                const totalSize = Array.from(files).reduce((sum, file) => sum + file.size, 0);
                const sizeMB = (totalSize / 1024 / 1024).toFixed(2);

                console.log(`📦 加载文件: ${files[0].name} (${sizeMB}MB)`);

                // 微信小程序环境下的大小限制警告
                if (isMiniProgram && totalSize > 50 * 1024 * 1024) { // 50MB
                    const warn = currentLanguage === 'zh'
                        ? `文件较大(${sizeMB}MB)，可能导致加载缓慢或内存不足。\n建议使用小于50MB的模型文件。\n\n是否继续加载？`
                        : `Large file (${sizeMB}MB) may cause slow loading or memory issues.\nRecommend files under 50MB.\n\nContinue?`;

                    if (!confirm(warn)) {
                        return;
                    }
                }

                const fileNameDiv = document.getElementById('currentFileName');
                fileNameDiv.innerHTML = `<i data-feather="file"></i><span>${files[0].name}</span>`;
                if (typeof feather !== 'undefined') {
                    feather.replace();
                }

                showLoading();

                // 添加超时保护（30秒）
                let loadTimeout = setTimeout(() => {
                    hideLoading();
                    const msg = currentLanguage === 'zh'
                        ? '模型加载超时，请尝试较小的文件'
                        : 'Model loading timeout, please try a smaller file';
                    alert(msg);
                }, 30000);

                // 清理超时的函数将在 viewer 的 onModelLoaded 回调中调用
                window._currentLoadTimeout = loadTimeout;

                viewer.LoadModelFromFileList(files);

            } catch (error) {
                console.error('❌ 加载失败:', error);
                const errorMsg = currentLanguage === 'zh'
                    ? '模型加载失败: ' + error.message
                    : 'Failed to load model: ' + error.message;
                alert(errorMsg);
                hideLoading();
            }
        }

        // 覆盖 loadModel 供移动端使用
        window.loadModel = loadModel;

        // 截图
        function takeScreenshot() {
            if (!viewer) return;

            try {
                const innerViewer = viewer.GetViewer();
                if (innerViewer && innerViewer.GetImageAsDataUrl) {
                    const dataUrl = innerViewer.GetImageAsDataUrl(1920, 1080, false);
                    const link = document.createElement('a');
                    link.download = `screenshot_${Date.now()}.png`;
                    link.href = dataUrl;
                    link.click();
                } else {
                    const msg = currentLanguage === 'zh' ? '截图功能暂不可用' : 'Screenshot feature unavailable';
                    alert(msg);
                }
            } catch (error) {
                console.error('截图失败:', error);
                const msg = currentLanguage === 'zh' ? '截图失败' : 'Screenshot failed';
                alert(msg);
            }
        }

        // 重置视图
        function resetView() {
            if (viewer) {
                viewer.Resize();
            }
        }

        // 全屏切换
        function toggleFullscreen() {
            const mainView = document.querySelector('.main-view');
            if (!document.fullscreenElement) {
                mainView.requestFullscreen();
            } else {
                document.exitFullscreen();
            }
        }

        // 更新模型统计
        function updateModelStats() {
            if (!currentModel) return;

            let meshCount = 0;
            let vertexCount = 0;
            let triangleCount = 0;
            let materialCount = currentModel.MaterialCount();

            for (let i = 0; i < currentModel.MeshCount(); i++) {
                const mesh = currentModel.GetMesh(i);
                meshCount++;
                vertexCount += mesh.VertexCount();
                triangleCount += mesh.TriangleCount();
            }

            document.getElementById('meshCount').textContent = meshCount;
            document.getElementById('vertexCount').textContent = formatNumber(vertexCount);
            document.getElementById('triangleCount').textContent = formatNumber(triangleCount);
            document.getElementById('materialCount').textContent = materialCount;
        }

        // 格式化数字
        function formatNumber(num) {
            if (num >= 1000000) {
                return (num / 1000000).toFixed(1) + 'M';
            } else if (num >= 1000) {
                return (num / 1000).toFixed(1) + 'K';
            }
            return num.toString();
        }

        // 显示/隐藏空状态
        function hideEmptyState() {
            document.getElementById('emptyOverlay').classList.add('hidden');
            hideLoading();
        }

        function showLoading() {
            document.getElementById('loadingOverlay').classList.add('active');
        }

        function hideLoading() {
            document.getElementById('loadingOverlay').classList.remove('active');
        }

        // 启用控制按钮
        function enableControls() {
            document.getElementById('screenshotBtn').disabled = false;
            document.getElementById('resetViewBtn').disabled = false;
            document.getElementById('toolbarScreenshotBtn').disabled = false;
            document.getElementById('toolbarResetBtn').disabled = false;
            document.getElementById('resetCameraBtn').disabled = false;
        }

        // 设置相机视角
        function setCameraView(view) {
            if (!viewer || !currentModel) return;

            try {
                const innerViewer = viewer.GetViewer();
                if (!innerViewer) return;

                // 获取模型边界框
                const bbox = OV.GetBoundingBox(currentModel);
                const center = new OV.Coord3D(
                    (bbox.min.x + bbox.max.x) / 2,
                    (bbox.min.y + bbox.max.y) / 2,
                    (bbox.min.z + bbox.max.z) / 2
                );

                // 计算适当的距离
                const size = Math.max(
                    bbox.max.x - bbox.min.x,
                    bbox.max.y - bbox.min.y,
                    bbox.max.z - bbox.min.z
                );
                const distance = size * 2;

                let eye, up;

                switch(view) {
                    case 'front':  // 前视图 (沿 +Z 方向看)
                        eye = new OV.Coord3D(center.x, center.y, center.z + distance);
                        up = new OV.Coord3D(0, 1, 0);
                        break;
                    case 'back':   // 后视图 (沿 -Z 方向看)
                        eye = new OV.Coord3D(center.x, center.y, center.z - distance);
                        up = new OV.Coord3D(0, 1, 0);
                        break;
                    case 'left':   // 左视图 (沿 -X 方向看)
                        eye = new OV.Coord3D(center.x - distance, center.y, center.z);
                        up = new OV.Coord3D(0, 1, 0);
                        break;
                    case 'right':  // 右视图 (沿 +X 方向看)
                        eye = new OV.Coord3D(center.x + distance, center.y, center.z);
                        up = new OV.Coord3D(0, 1, 0);
                        break;
                    case 'top':    // 俯视图 (沿 +Y 方向看)
                        eye = new OV.Coord3D(center.x, center.y + distance, center.z);
                        up = new OV.Coord3D(0, 0, -1);
                        break;
                    case 'bottom': // 仰视图 (沿 -Y 方向看)
                        eye = new OV.Coord3D(center.x, center.y - distance, center.z);
                        up = new OV.Coord3D(0, 0, 1);
                        break;
                }

                const camera = new OV.Camera(eye, center, up, 45.0);
                innerViewer.SetCamera(camera);
            } catch (error) {
                console.error('设置相机视角失败:', error);
            }
        }

        // 重置相机
        function resetCamera() {
            if (!viewer || !currentModel) return;

            try {
                const innerViewer = viewer.GetViewer();
                if (!innerViewer) return;

                // 获取模型边界框并重新适应窗口
                const bbox = OV.GetBoundingBox(currentModel);
                const center = new OV.Coord3D(
                    (bbox.min.x + bbox.max.x) / 2,
                    (bbox.min.y + bbox.max.y) / 2,
                    (bbox.min.z + bbox.max.z) / 2
                );

                const size = Math.max(
                    bbox.max.x - bbox.min.x,
                    bbox.max.y - bbox.min.y,
                    bbox.max.z - bbox.min.z
                );
                const distance = size * 2;

                // 默认视角 (类似45度角视图)
                const eye = new OV.Coord3D(
                    center.x - distance * 0.7,
                    center.y + distance * 0.7,
                    center.z + distance * 0.7
                );
                const up = new OV.Coord3D(0, 1, 0);

                const camera = new OV.Camera(eye, center, up, 45.0);
                innerViewer.SetCamera(camera);
            } catch (error) {
                console.error('重置相机失败:', error);
            }
        }

        // 设置投影模式
        function setProjectionMode(mode) {
            if (!viewer) return;

            try {
                const innerViewer = viewer.GetViewer();
                if (!innerViewer || !innerViewer.SetProjectionMode) return;

                const projectionMode = mode === 'perspective'
                    ? OV.ProjectionMode.Perspective
                    : OV.ProjectionMode.Orthographic;

                innerViewer.SetProjectionMode(projectionMode);
            } catch (error) {
                console.error('设置投影模式失败:', error);
            }
        }

        // 从URL参数加载模型
        function loadModelFromUrl() {
            try {
                const urlParams = new URLSearchParams(window.location.search);
                const modelUrl = urlParams.get('modelUrl');
                const productName = urlParams.get('productName');

                if (modelUrl) {
                    console.log('🌐 检测到URL参数 - 模型URL:', decodeURIComponent(modelUrl));
                    if (productName) {
                        console.log('📦 产品名称:', decodeURIComponent(productName));
                    }
                    
                    // 延迟加载，确保viewer已完全初始化
                    setTimeout(() => {
                        loadModelFromRemoteUrl(decodeURIComponent(modelUrl), productName ? decodeURIComponent(productName) : '产品模型');
                    }, 500);
                } else {
                    console.log('ℹ️ 未检测到模型URL参数，等待用户上传文件');
                }
            } catch (error) {
                console.error('❌ 解析URL参数失败:', error);
            }
        }

        // 从远程URL加载模型
        async function loadModelFromRemoteUrl(url, productName = '产品模型') {
            if (!viewer || !url) {
                console.error('❌ Viewer未初始化或URL为空');
                return;
            }

            try {
                console.log('🚀 开始从远程URL加载模型:', url);
                
                // 显示加载状态
                showLoading();
                
                // 更新文件名显示
                const fileNameDiv = document.getElementById('currentFileName');
                fileNameDiv.innerHTML = `<i data-feather="file"></i><span>${productName}</span>`;
                if (typeof feather !== 'undefined') {
                    feather.replace();
                }

                // 检测文件类型
                const extension = url.split('.').pop().toLowerCase().split('?')[0];
                console.log('📄 文件扩展名:', extension);

                // 添加超时保护（60秒，远程文件可能较大）
                const loadTimeout = setTimeout(() => {
                    hideLoading();
                    const msg = currentLanguage === 'zh'
                        ? '模型加载超时，请检查网络连接或尝试较小的文件'
                        : 'Model loading timeout, please check network or try a smaller file';
                    alert(msg);
                }, 60000);

                window._currentLoadTimeout = loadTimeout;

                // 使用fetch下载文件
                const response = await fetch(url);
                
                if (!response.ok) {
                    throw new Error(`HTTP错误! 状态: ${response.status}`);
                }

                const blob = await response.blob();
                console.log('✅ 文件下载成功，大小:', (blob.size / 1024 / 1024).toFixed(2), 'MB');

                // 创建File对象
                const fileName = url.split('/').pop().split('?')[0] || `${productName}.${extension}`;
                const file = new File([blob], fileName, { type: blob.type });

                // 加载到viewer
                viewer.LoadModelFromFileList([file]);
                
                console.log('✅ 模型加载指令已发送到Viewer');

            } catch (error) {
                console.error('❌ 从远程URL加载模型失败:', error);
                
                hideLoading();
                
                // 清除超时
                if (window._currentLoadTimeout) {
                    clearTimeout(window._currentLoadTimeout);
                    window._currentLoadTimeout = null;
                }

                const errorMsg = currentLanguage === 'zh'
                    ? `模型加载失败: ${error.message}\n\n可能原因：\n1. 网络连接问题\n2. 文件不存在\n3. 跨域限制\n4. 文件格式不支持`
                    : `Failed to load model: ${error.message}\n\nPossible reasons:\n1. Network issue\n2. File not found\n3. CORS restriction\n4. Unsupported format`;
                
                alert(errorMsg);
            }
        }

        // 导出函数供外部调用（可选）
        window.loadModelFromRemoteUrl = loadModelFromRemoteUrl;
    </script>
</body>
</html>
