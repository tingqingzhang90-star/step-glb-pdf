<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D 模型查看器</title>
<!-- o3dv 渲染库(本地静态资源,defer 不阻塞 HTML 渲染) -->
<script src="/static/o3dv/o3dv.min.js" defer></script>
<!-- Feather Icons CDN(defer 不阻塞页面) -->
<script src="https://cdn.bootcdn.net/ajax/libs/feather-icons/4.29.0/feather.min.js" defer></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --gray-800:#424242;--gray-850:#303030;--gray-900:#212121;--gray-950:#1a1a1a;
    --primary-500:#2196f3;--primary-600:#1e88e5;--primary-700:#1976d2;
    --shadow-sm:0 1px 2px 0 rgba(0,0,0,.05);--shadow-md:0 2px 4px 0 rgba(0,0,0,.08);
    --shadow-lg:0 4px 8px 0 rgba(0,0,0,.12);--shadow-xl:0 8px 16px 0 rgba(0,0,0,.16);
    --bg-canvas:#1a1a1a;--bg-surface:#212121;--bg-elevated:#2a2a2a;--bg-overlay:#303030;
    --border-subtle:rgba(255,255,255,.08);--border-normal:rgba(255,255,255,.12);
    --border-strong:rgba(255,255,255,.16);
    --text-primary:#e0e0e0;--text-secondary:#9e9e9e;--text-tertiary:#757575;
  }
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Roboto','Microsoft YaHei',Arial,sans-serif;
       background:var(--bg-canvas);color:var(--text-primary);overflow:hidden;
       -webkit-font-smoothing:antialiased}
  .app{display:flex;height:calc(100vh - var(--panel-nav-offset,60px))}
  /* 侧边栏 */
  .sidebar{width:320px;background:var(--bg-surface);display:flex;flex-direction:column;
           border-right:1px solid var(--border-normal);box-shadow:var(--shadow-lg)}
  .sidebar-header{padding:20px 24px;background:var(--bg-elevated);
                  border-bottom:1px solid var(--border-normal);
                  display:flex;align-items:center;gap:12px}
  .sidebar-header .logo{width:36px;height:36px;background:var(--primary-700);border-radius:8px;
                        display:flex;align-items:center;justify-content:center;flex-shrink:0;
                        box-shadow:var(--shadow-md)}
  .sidebar-header .logo i{width:20px;height:20px;stroke:#fff;stroke-width:2.5}
  .sidebar-header .header-text{flex:1}
  .sidebar-header h1{font-size:16px;font-weight:600;margin-bottom:2px;letter-spacing:-.01em}
  .sidebar-header p{font-size:11px;opacity:.65;text-transform:uppercase;letter-spacing:.5px}
  .back-btn{padding:7px 12px;border:1px solid var(--border-normal);border-radius:6px;
            background:var(--bg-elevated);color:var(--text-secondary);cursor:pointer;
            font-size:12px;font-weight:500;text-decoration:none;transition:.15s;
            display:flex;align-items:center;gap:5px;flex-shrink:0}
  .back-btn:hover{background:var(--bg-overlay);border-color:var(--border-strong);color:var(--text-primary)}
  .back-btn i{width:14px;height:14px;stroke-width:2.5}
  .sidebar-content{flex:1;overflow-y:auto;padding:20px}
  .section{margin-bottom:24px}
  .section-title{font-size:11px;font-weight:600;text-transform:uppercase;color:var(--text-secondary);
                 margin-bottom:12px;letter-spacing:.8px;display:flex;align-items:center;gap:8px}
  .section-title i{width:14px;height:14px;stroke-width:2.5}
  .file-upload{border:2px dashed var(--border-normal);border-radius:8px;padding:24px;
               text-align:center;cursor:pointer;transition:.15s;background:var(--bg-canvas)}
  .file-upload:hover{border-color:var(--border-strong);background:var(--bg-elevated)}
  .file-upload.dragover{border-color:var(--primary-600);border-style:solid;
                        background:color-mix(in srgb,var(--primary-600) 8%,var(--bg-elevated))}
  .file-upload input{display:none}
  .upload-icon{width:48px;height:48px;margin:0 auto 16px;stroke:var(--primary-600);stroke-width:1.5}
  .upload-text{font-size:13px;color:var(--text-secondary);line-height:1.6}
  .upload-text strong{color:var(--text-primary);font-weight:500}
  .control-group{margin-bottom:16px}
  .btn{width:100%;padding:11px 16px;border:1px solid var(--border-normal);border-radius:6px;
       font-size:13px;font-weight:500;cursor:pointer;transition:.15s;background:var(--bg-elevated);
       color:var(--text-primary);display:flex;align-items:center;justify-content:center;gap:8px;
       box-shadow:var(--shadow-sm)}
  .btn i{width:16px;height:16px;stroke-width:2.5}
  .btn:hover:not(:disabled){background:var(--bg-overlay);border-color:var(--border-strong)}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn-primary{background:var(--primary-700);border-color:var(--primary-700);color:#fff}
  .btn-primary:hover:not(:disabled){background:var(--primary-600);border-color:var(--primary-600)}
  select{width:100%;padding:10px 12px;border:1px solid var(--border-normal);border-radius:6px;
         background:var(--bg-canvas);color:var(--text-primary);font-size:14px;cursor:pointer;transition:.15s}
  select:hover{border-color:var(--border-strong);background:var(--bg-elevated)}
  select:focus{outline:none;border-color:var(--primary-600);
               box-shadow:0 0 0 3px color-mix(in srgb,var(--primary-600) 15%,transparent)}
  select option{background:var(--bg-surface);color:var(--text-primary);padding:8px}
  .stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .stat-card{background:var(--bg-elevated);padding:16px;border-radius:8px;
             border:1px solid var(--border-normal);box-shadow:var(--shadow-sm);transition:.15s}
  .stat-card:hover{border-color:var(--border-strong)}
  .stat-value{font-size:24px;font-weight:600;color:var(--primary-500);margin-bottom:4px}
  .stat-label{font-size:12px;color:var(--text-secondary);font-weight:500;letter-spacing:.3px}
  .view-buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
  .view-btn{padding:10px;border:1px solid var(--border-normal);border-radius:6px;
            background:var(--bg-elevated);color:var(--text-secondary);cursor:pointer;
            font-size:12px;font-weight:500;transition:.15s;display:flex;align-items:center;
            justify-content:center;gap:6px;box-shadow:var(--shadow-sm)}
  .view-btn i{width:14px;height:14px;stroke-width:2.5}
  .view-btn:hover{background:var(--bg-overlay);border-color:var(--border-strong);color:var(--text-primary)}
  .view-btn:active{background:var(--bg-elevated)}
  /* 主视图 */
  .main-view{flex:1;display:flex;flex-direction:column;overflow:hidden}
  .toolbar{padding:16px 24px;background:var(--bg-surface);border-bottom:1px solid var(--border-normal);
           display:flex;gap:12px;align-items:center;box-shadow:var(--shadow-sm)}
  .toolbar-btn{padding:9px 14px;border:1px solid var(--border-normal);border-radius:6px;
               background:var(--bg-elevated);color:var(--text-secondary);cursor:pointer;
               font-size:13px;font-weight:500;transition:.15s;display:flex;align-items:center;
               gap:8px;box-shadow:var(--shadow-sm)}
  .toolbar-btn i{width:16px;height:16px;stroke-width:2.5}
  .toolbar-btn:hover:not(:disabled){background:var(--bg-overlay);border-color:var(--border-strong);color:var(--text-primary)}
  .toolbar-btn:disabled{opacity:.5;cursor:not-allowed}
  .toolbar-btn.file-name{background:transparent;border-color:transparent;box-shadow:none;cursor:default}
  .toolbar-btn.file-name:hover{background:transparent;border-color:transparent;color:var(--text-secondary)}
  .spacer{flex:1}
  .menu-toggle{display:none;padding:8px 12px;border:1px solid var(--border-normal);border-radius:6px;
               background:var(--bg-elevated);color:var(--text-secondary);cursor:pointer;align-items:center;justify-content:center}
  .menu-toggle i{width:18px;height:18px;stroke-width:2.5}
  .viewer-area{flex:1;position:relative;overflow:hidden}
  .viewer-container{width:100%;height:100%}
  .empty-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
                 background:var(--bg-canvas);z-index:10;transition:opacity .3s}
  .empty-overlay.hidden{opacity:0;pointer-events:none}
  .empty-content{text-align:center;color:var(--text-secondary)}
  .empty-icon{font-size:80px;margin-bottom:16px;display:inline-block}
  .empty-content h2{font-size:24px;margin-bottom:8px;font-weight:600;color:var(--text-primary)}
  .empty-content p{font-size:14px}
  .loading-overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
                   background:rgba(26,26,26,.85);z-index:20;backdrop-filter:blur(4px)}
  .loading-overlay.active{display:flex}
  .loader{text-align:center;background:var(--bg-elevated);padding:32px 48px;border-radius:12px;
          border:1px solid var(--border-normal);box-shadow:var(--shadow-xl)}
  .spinner{width:48px;height:48px;border:4px solid var(--border-normal);
           border-top-color:var(--primary-600);border-radius:50%;
           animation:spin .8s linear infinite;margin:0 auto 16px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .loader p{font-size:14px;color:var(--text-primary)}
  .sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);
                   backdrop-filter:blur(2px);z-index:1000;opacity:0;transition:opacity .3s}
  .sidebar-overlay.active{display:block;opacity:1}
  /* 响应式 */
  @media(max-width:768px){
    .sidebar{position:fixed;left:0;top:0;bottom:0;z-index:1001;transform:translateX(-100%);
             transition:transform .3s ease;box-shadow:var(--shadow-xl)}
    .sidebar.open{transform:translateX(0)}
    .menu-toggle{display:flex}
    .toolbar-btn span,.view-btn span{font-size:11px}
  }
  @media(max-width:480px){
    .sidebar{width:90vw}
    .stats-grid{grid-template-columns:1fr}
    .toolbar-btn:not(.menu-toggle):not(:first-child) span{display:none}
  }
</style>
<script src="/static/panel_nav.js" defer></script>
</head>
<body>
<div class="sidebar-overlay" id="sidebarOverlay"></div>
<div class="app">
  <!-- 侧边栏 -->
  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="logo"><i data-feather="box"></i></div>
      <div class="header-text">
        <h1>3D 模型查看器</h1>
        <p>Powered by o3dv</p>
      </div>
      <a class="back-btn" href="/" title="返回生成面板"><i data-feather="arrow-left"></i>返回</a>
    </div>
    <div class="sidebar-content">
      <!-- 文件上传 -->
      <div class="section">
        <div class="section-title"><i data-feather="upload"></i><span>加载模型</span></div>
        <div class="file-upload" id="fileUpload">
          <input type="file" id="fileInput" multiple
                 accept=".obj,.stl,.gltf,.glb,.ply,.off,.3ds,.fbx,.step,.stp,.iges,.igs,.brep,.brp,.ifc,.fcstd,.3dm,.dae,.wrl,.3mf,.amf">
          <i data-feather="package" class="upload-icon"></i>
          <div class="upload-text">
            <strong>点击或拖拽文件</strong><br>
            <span>OBJ, STL, GLTF, GLB, STEP, IGES, IFC...</span>
          </div>
        </div>
      </div>
      <!-- 相机视角 -->
      <div class="section">
        <div class="section-title"><i data-feather="camera"></i><span>相机视角</span></div>
        <div class="view-buttons">
          <button class="view-btn" data-view="front"><i data-feather="arrow-up"></i><span>前视图</span></button>
          <button class="view-btn" data-view="back"><i data-feather="arrow-down"></i><span>后视图</span></button>
          <button class="view-btn" data-view="left"><i data-feather="arrow-left"></i><span>左视图</span></button>
          <button class="view-btn" data-view="right"><i data-feather="arrow-right"></i><span>右视图</span></button>
          <button class="view-btn" data-view="top"><i data-feather="chevron-up"></i><span>俯视图</span></button>
          <button class="view-btn" data-view="bottom"><i data-feather="chevron-down"></i><span>仰视图</span></button>
        </div>
        <div class="control-group">
          <button class="btn" id="resetCameraBtn" disabled>
            <i data-feather="rotate-ccw"></i><span>重置相机</span>
          </button>
        </div>
      </div>
      <!-- 投影模式 -->
      <div class="section">
        <div class="section-title"><i data-feather="aperture"></i><span>投影模式</span></div>
        <div class="control-group">
          <select id="projectionSelect">
            <option value="perspective">透视投影</option>
            <option value="orthographic">正交投影</option>
          </select>
        </div>
      </div>
      <!-- 背景设置 -->
      <div class="section">
        <div class="section-title"><i data-feather="droplet"></i><span>外观设置</span></div>
        <div class="control-group">
          <select id="bgColorSelect">
            <option value="dark">深色背景</option>
            <option value="light">浅色背景</option>
            <option value="gray">灰色背景</option>
            <option value="black">纯黑背景</option>
          </select>
        </div>
        <div class="control-group">
          <button class="btn" id="edgeToggleBtn">
            <i data-feather="box"></i><span>边线: 开</span>
          </button>
        </div>
      </div>
      <!-- 操作 -->
      <div class="section">
        <div class="section-title"><i data-feather="tool"></i><span>操作</span></div>
        <div class="control-group">
          <button class="btn" id="resetViewBtn" disabled>
            <i data-feather="refresh-cw"></i><span>重置视图</span>
          </button>
        </div>
        <div class="control-group">
          <button class="btn btn-primary" id="fullscreenBtn">
            <i data-feather="maximize"></i><span>全屏</span>
          </button>
        </div>
      </div>
      <!-- 边线提取 -->
      <div class="section">
        <div class="section-title"><i data-feather="layers"></i><span>视图边线提取</span></div>
        <div class="control-group">
          <button class="btn" id="extractEdgesBtn" disabled>
            <i data-feather="download-cloud"></i><span>提取6视图边线</span>
          </button>
        </div>
        <div id="edgeExtractResult" style="font-size:11px;color:var(--text-secondary);line-height:1.6;display:none"></div>
      </div>
      <!-- 模型统计 -->
      <div class="section">
        <div class="section-title"><i data-feather="bar-chart-2"></i><span>模型统计</span></div>
        <div class="stats-grid">
          <div class="stat-card"><div class="stat-value" id="meshCount">-</div><div class="stat-label">网格数</div></div>
          <div class="stat-card"><div class="stat-value" id="triangleCount">-</div><div class="stat-label">三角面</div></div>
          <div class="stat-card"><div class="stat-value" id="vertexCount">-</div><div class="stat-label">顶点数</div></div>
          <div class="stat-card"><div class="stat-value" id="materialCount">-</div><div class="stat-label">材质数</div></div>
        </div>
      </div>
    </div>
  </div>
  <!-- 主视图 -->
  <div class="main-view">
    <div class="toolbar">
      <button class="menu-toggle" id="menuToggle"><i data-feather="menu"></i></button>
      <button class="toolbar-btn" id="toolbarResetBtn" disabled>
        <i data-feather="refresh-cw"></i><span>重置</span>
      </button>
      <div class="spacer"></div>
      <div class="toolbar-btn file-name" id="currentFileName">
        <i data-feather="file"></i><span>未加载模型</span>
      </div>
    </div>
    <div class="viewer-area">
      <div class="viewer-container" id="viewerContainer"></div>
      <div class="empty-overlay" id="emptyOverlay">
        <div class="empty-content">
          <i data-feather="box" class="empty-icon" style="width:80px;height:80px;stroke-width:1.5"></i>
          <h2>开始使用</h2>
          <p>选择或拖拽 3D 模型文件,或从生成面板点击「查看模型」</p>
        </div>
      </div>
      <div class="loading-overlay" id="loadingOverlay">
        <div class="loader">
          <div class="spinner"></div>
          <p>正在加载模型...</p>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- 内联脚本:HTML 解析时立即检查 URL 参数,提前显示加载动画(不等 o3dv.min.js 下载) -->
<script>
  (function () {
    var p = new URLSearchParams(location.search);
    if (p.get('modelUrl')) {
      var lo = document.getElementById('loadingOverlay');
      var eo = document.getElementById('emptyOverlay');
      if (lo) lo.classList.add('active');
      if (eo) eo.classList.add('hidden');
    }
  })();
</script>

<script>
  let viewer = null;
  let currentModel = null;
  let bgColors = null;

  // 等 DOM 解析完成即初始化(配合 defer 脚本,o3dv 已就绪)
  document.addEventListener('DOMContentLoaded', function () {
    if (typeof OV === 'undefined') {
      alert('3D 渲染库(o3dv)加载失败,请检查 /static/o3dv/o3dv.min.js 是否可访问');
      return;
    }
    console.log('OV 库加载成功');

    if (typeof feather !== 'undefined') {
      feather.replace();
    }

    // 背景颜色配置
    bgColors = {
      dark: new OV.RGBAColor(15, 20, 25, 255),
      light: new OV.RGBAColor(248, 249, 250, 255),
      gray: new OV.RGBAColor(128, 128, 128, 255),
      black: new OV.RGBAColor(0, 0, 0, 255)
    };

    initViewer();
    initEventListeners();
    initMobileMenu();
    // 检查 URL 参数,自动加载模型
    loadModelFromUrl();
  });

  // 初始化 viewer
  function initViewer() {
    const container = document.getElementById('viewerContainer');
    const viewerConfig = {
      backgroundColor: new OV.RGBAColor(15, 20, 25, 255),
      defaultColor: new OV.RGBColor(200, 200, 200),
      edgeSettings: new OV.EdgeSettings(true, new OV.RGBColor(80, 80, 80), 25),
      onModelLoaded: () => {
        if (window._currentLoadTimeout) {
          clearTimeout(window._currentLoadTimeout);
          window._currentLoadTimeout = null;
        }
        hideEmptyState();
        currentModel = viewer.GetModel();
        updateModelStats();
        enableControls();
        hideLoading();
        console.log('模型加载完成');
      }
    };
    try {
      viewer = new OV.EmbeddedViewer(container, viewerConfig);
      console.log('Viewer 初始化成功');
    } catch (error) {
      console.error('Viewer 初始化失败:', error);
      alert('3D 查看器初始化失败:\n' + error.message);
    }
  }

  // ★ 硬边叠加渲染(Three.js)已移除,改用 o3dv 原生 EdgeSettings(见 initViewer)
  // 如需恢复 Three.js 硬边叠加层,请参考 git 历史中的 initEdgeOverlay/loadEdgesOverlay 等函数

  // 事件监听
  function initEventListeners() {
    const fileInput = document.getElementById('fileInput');
    const fileUpload = document.getElementById('fileUpload');

    fileInput.addEventListener('change', (e) => {
      if (e.target.files.length > 0) loadModel(e.target.files);
    });
    fileUpload.addEventListener('click', () => fileInput.click());
    fileUpload.addEventListener('dragover', (e) => {
      e.preventDefault();
      fileUpload.classList.add('dragover');
    });
    fileUpload.addEventListener('dragleave', () => fileUpload.classList.remove('dragover'));
    fileUpload.addEventListener('drop', (e) => {
      e.preventDefault();
      fileUpload.classList.remove('dragover');
      if (e.dataTransfer.files.length > 0) loadModel(e.dataTransfer.files);
    });

    // 背景颜色
    document.getElementById('bgColorSelect').addEventListener('change', (e) => {
      const color = bgColors[e.target.value];
      if (color && viewer) {
        try {
          const innerViewer = viewer.GetViewer();
          if (innerViewer && innerViewer.SetBackgroundColor) {
            innerViewer.SetBackgroundColor(color);
          }
        } catch (error) { console.log('背景色设置失败'); }
      }
    });

    // 重置视图
    document.getElementById('resetViewBtn').addEventListener('click', resetView);
    document.getElementById('toolbarResetBtn').addEventListener('click', resetView);

    // 全屏
    document.getElementById('fullscreenBtn').addEventListener('click', toggleFullscreen);

    // 相机视角
    document.querySelectorAll('.view-btn').forEach(btn => {
      btn.addEventListener('click', () => setCameraView(btn.dataset.view));
    });

    // 重置相机
    document.getElementById('resetCameraBtn').addEventListener('click', resetCamera);

    // 提取视图边线
    document.getElementById('extractEdgesBtn').addEventListener('click', extractStandardViewEdges);

    // 投影模式
    document.getElementById('projectionSelect').addEventListener('change', (e) => {
      setProjectionMode(e.target.value);
    });

    // 边线开关
    let edgeEnabled = true;
    document.getElementById('edgeToggleBtn').addEventListener('click', () => {
      edgeEnabled = !edgeEnabled;
      const btn = document.getElementById('edgeToggleBtn');
      btn.querySelector('span').textContent = edgeEnabled ? '边线: 开' : '边线: 关';
      if (viewer) {
        try {
          const innerViewer = viewer.GetViewer();
          if (innerViewer && innerViewer.SetEdgeSettings) {
            innerViewer.SetEdgeSettings(new OV.EdgeSettings(edgeEnabled, new OV.RGBColor(80, 80, 80), 25));
          }
        } catch (error) { console.log('边线切换失败'); }
      }
    });
  }

  // 移动端菜单
  function initMobileMenu() {
    const menuToggle = document.getElementById('menuToggle');
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('sidebarOverlay');
    menuToggle.addEventListener('click', () => {
      sidebar.classList.toggle('open');
      overlay.classList.toggle('active');
    });
    overlay.addEventListener('click', () => {
      sidebar.classList.remove('open');
      overlay.classList.remove('active');
    });
  }

  // 加载模型(本地 File 列表)
  function loadModel(files) {
    if (!viewer || !files || files.length === 0) return;
    try {
      const totalSize = Array.from(files).reduce((sum, f) => sum + f.size, 0);
      console.log(`加载文件: ${files[0].name} (${(totalSize / 1024 / 1024).toFixed(2)}MB)`);

      const fileNameDiv = document.getElementById('currentFileName');
      fileNameDiv.innerHTML = `<i data-feather="file"></i><span>${files[0].name}</span>`;
      if (typeof feather !== 'undefined') feather.replace();

      showLoading();
      const loadTimeout = setTimeout(() => {
        hideLoading();
        alert('模型加载超时,请尝试较小的文件');
      }, 30000);
      window._currentLoadTimeout = loadTimeout;

      viewer.LoadModelFromFileList(files);
    } catch (error) {
      console.error('加载失败:', error);
      alert('模型加载失败: ' + error.message);
      hideLoading();
    }
  }

  // 从 URL 参数读取并加载模型
  function loadModelFromUrl() {
    try {
      const urlParams = new URLSearchParams(window.location.search);
      const modelUrl = urlParams.get('modelUrl');
      const productName = urlParams.get('productName');
      if (modelUrl) {
        console.log('检测到 URL 参数 - 模型 URL:', decodeURIComponent(modelUrl));
        // 直接加载,无需延迟(DOMContentLoaded 时 viewer 已通过 defer 就绪)
        loadModelFromRemoteUrl(
          decodeURIComponent(modelUrl),
          productName ? decodeURIComponent(productName) : '产品模型'
        );
      } else {
        console.log('未检测到模型 URL 参数,等待用户上传文件');
      }
    } catch (error) {
      console.error('解析 URL 参数失败:', error);
    }
  }

  // 从远程 URL 加载模型
  async function loadModelFromRemoteUrl(url, productName = '产品模型') {
    if (!viewer || !url) {
      console.error('Viewer 未初始化或 URL 为空');
      return;
    }
    try {
      console.log('开始从 URL 加载模型:', url);
      showLoading();

      const fileNameDiv = document.getElementById('currentFileName');
      fileNameDiv.innerHTML = `<i data-feather="file"></i><span>${productName}</span>`;
      if (typeof feather !== 'undefined') feather.replace();

      // 超时保护(60 秒,远程文件可能较大)
      const loadTimeout = setTimeout(() => {
        hideLoading();
        alert('模型加载超时,请检查网络连接或尝试较小的文件');
      }, 60000);
      window._currentLoadTimeout = loadTimeout;

      // ★ 优先使用 o3dv 原生 URL 加载(避免 fetch+blob 双重内存)
      if (typeof viewer.LoadModelFromUrlList === 'function') {
        viewer.LoadModelFromUrlList([url]);
        console.log('模型加载指令已发送(LoadModelFromUrlList)');
      } else {
        // 回退:fetch + File 方式(旧版兼容)
        console.log('LoadModelFromUrlList 不可用,回退到 fetch 方式');
        const response = await fetch(url);
        if (!response.ok) throw new Error(`HTTP 错误! 状态: ${response.status}`);
        const blob = await response.blob();
        console.log('文件下载成功,大小:', (blob.size / 1024 / 1024).toFixed(2), 'MB');
        const fileName = url.split('/').pop().split('?')[0] || `${productName}.glb`;
        const file = new File([blob], fileName, { type: blob.type });
        viewer.LoadModelFromFileList([file]);
      }
    } catch (error) {
      console.error('从 URL 加载模型失败:', error);
      hideLoading();
      if (window._currentLoadTimeout) {
        clearTimeout(window._currentLoadTimeout);
        window._currentLoadTimeout = null;
      }
      alert(`模型加载失败: ${error.message}\n\n可能原因:\n1. 网络连接问题\n2. 文件不存在\n3. 跨域限制\n4. 文件格式不支持`);
    }
  }

  // 重置视图
  function resetView() {
    if (viewer) viewer.Resize();
  }

  // 全屏切换
  function toggleFullscreen() {
    const mainView = document.querySelector('.main-view');
    if (!document.fullscreenElement) {
      mainView.requestFullscreen();
    } else {
      document.exitFullscreen();
    }
  }

  // 更新模型统计
  function updateModelStats() {
    if (!currentModel) return;
    let meshCount = 0, vertexCount = 0, triangleCount = 0;
    const materialCount = currentModel.MaterialCount();
    for (let i = 0; i < currentModel.MeshCount(); i++) {
      const mesh = currentModel.GetMesh(i);
      meshCount++;
      vertexCount += mesh.VertexCount();
      triangleCount += mesh.TriangleCount();
    }
    document.getElementById('meshCount').textContent = meshCount;
    document.getElementById('vertexCount').textContent = formatNumber(vertexCount);
    document.getElementById('triangleCount').textContent = formatNumber(triangleCount);
    document.getElementById('materialCount').textContent = materialCount;
  }

  function formatNumber(num) {
    if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
    if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
    return num.toString();
  }

  function hideEmptyState() {
    document.getElementById('emptyOverlay').classList.add('hidden');
    hideLoading();
  }
  function showLoading() { document.getElementById('loadingOverlay').classList.add('active'); }
  function hideLoading() { document.getElementById('loadingOverlay').classList.remove('active'); }

  function enableControls() {
    document.getElementById('resetViewBtn').disabled = false;
    document.getElementById('toolbarResetBtn').disabled = false;
    document.getElementById('resetCameraBtn').disabled = false;
    document.getElementById('extractEdgesBtn').disabled = false;
  }

  // 设置相机视角
  function setCameraView(view) {
    if (!viewer || !currentModel) return;
    try {
      const innerViewer = viewer.GetViewer();
      if (!innerViewer) return;
      const bbox = OV.GetBoundingBox(currentModel);
      const center = new OV.Coord3D(
        (bbox.min.x + bbox.max.x) / 2,
        (bbox.min.y + bbox.max.y) / 2,
        (bbox.min.z + bbox.max.z) / 2
      );
      const size = Math.max(bbox.max.x - bbox.min.x, bbox.max.y - bbox.min.y, bbox.max.z - bbox.min.z);
      const distance = size * 2;
      let eye, up;
      switch (view) {
        case 'front':  eye = new OV.Coord3D(center.x, center.y, center.z + distance); up = new OV.Coord3D(0, 1, 0); break;
        case 'back':   eye = new OV.Coord3D(center.x, center.y, center.z - distance); up = new OV.Coord3D(0, 1, 0); break;
        case 'left':   eye = new OV.Coord3D(center.x - distance, center.y, center.z); up = new OV.Coord3D(0, 1, 0); break;
        case 'right':  eye = new OV.Coord3D(center.x + distance, center.y, center.z); up = new OV.Coord3D(0, 1, 0); break;
        case 'top':    eye = new OV.Coord3D(center.x, center.y + distance, center.z); up = new OV.Coord3D(0, 0, -1); break;
        case 'bottom': eye = new OV.Coord3D(center.x, center.y - distance, center.z); up = new OV.Coord3D(0, 0, 1); break;
      }
      const camera = new OV.Camera(eye, center, up, 45.0);
      innerViewer.SetCamera(camera);
    } catch (error) { console.error('设置相机视角失败:', error); }
  }

  // 重置相机
  function resetCamera() {
    if (!viewer || !currentModel) return;
    try {
      const innerViewer = viewer.GetViewer();
      if (!innerViewer) return;
      const bbox = OV.GetBoundingBox(currentModel);
      const center = new OV.Coord3D(
        (bbox.min.x + bbox.max.x) / 2,
        (bbox.min.y + bbox.max.y) / 2,
        (bbox.min.z + bbox.max.z) / 2
      );
      const size = Math.max(bbox.max.x - bbox.min.x, bbox.max.y - bbox.min.y, bbox.max.z - bbox.min.z);
      const distance = size * 2;
      const eye = new OV.Coord3D(
        center.x - distance * 0.7,
        center.y + distance * 0.7,
        center.z + distance * 0.7
      );
      const up = new OV.Coord3D(0, 1, 0);
      const camera = new OV.Camera(eye, center, up, 45.0);
      innerViewer.SetCamera(camera);
    } catch (error) { console.error('重置相机失败:', error); }
  }

  // 设置投影模式
  function setProjectionMode(mode) {
    if (!viewer) return;
    try {
      const innerViewer = viewer.GetViewer();
      if (!innerViewer || !innerViewer.SetProjectionMode) return;
      const projectionMode = mode === 'perspective'
        ? OV.ProjectionMode.Perspective
        : OV.ProjectionMode.Orthographic;
      innerViewer.SetProjectionMode(projectionMode);
    } catch (error) { console.error('设置投影模式失败:', error); }
  }

  // 提取6个标准视图的边线数据(用于工程图标注)
  // 使用深度缓冲做隐藏线消除(HLR),只保留可见边
  function extractStandardViewEdges() {
    if (!viewer || !currentModel) {
      alert('请先加载模型');
      return;
    }
    const resultEl = document.getElementById('edgeExtractResult');
    resultEl.style.display = 'block';
    resultEl.innerHTML = '<div style="color:var(--text-primary)">正在提取边线(含HLR)...</div>';

    try {
      const innerViewer = viewer.GetViewer();
      const scene = innerViewer.scene;
      const renderer = innerViewer.renderer;
      const bbox = OV.GetBoundingBox(currentModel);
      const center = {
        x: (bbox.min.x + bbox.max.x) / 2,
        y: (bbox.min.y + bbox.max.y) / 2,
        z: (bbox.min.z + bbox.max.z) / 2
      };
      const size = Math.max(bbox.max.x - bbox.min.x, bbox.max.y - bbox.min.y, bbox.max.z - bbox.min.z);
      const distance = size * 2;

      // 获取 THREE 命名空间(从 scene 原型链提取)
      // scene 是 THREE.Scene 实例,其 __proto__ 链上有 Object3D
      const THREE_NS = getThreeNamespace(scene);

      // 1. 收集所有边线 3D 顶点(世界坐标 mm)
      const allEdges = [];
      scene.traverse(obj => {
        if (obj.type === 'LineSegments' || obj.type === 'Line') {
          const pos = obj.geometry.attributes.position;
          if (pos) {
            const m = obj.matrixWorld;
            const e = m.elements;
            for (let i = 0; i < pos.count; i += 2) {
              const x1 = pos.getX(i), y1 = pos.getY(i), z1 = pos.getZ(i);
              const x2 = pos.getX(i + 1), y2 = pos.getY(i + 1), z2 = pos.getZ(i + 1);
              allEdges.push({
                v1: [e[0]*x1+e[4]*y1+e[8]*z1+e[12], e[1]*x1+e[5]*y1+e[9]*z1+e[13], e[2]*x1+e[6]*y1+e[10]*z1+e[14]],
                v2: [e[0]*x2+e[4]*y2+e[8]*z2+e[12], e[1]*x2+e[5]*y2+e[9]*z2+e[13], e[2]*x2+e[6]*y2+e[10]*z2+e[14]]
              });
            }
          }
        }
      });

      // 2. 视图方向配置(与 setCameraView 完全一致)
      const viewConfigs = {
        '前视(front)':  { eye: [0, 0, distance], up: [0, 1, 0] },
        '后视(back)':   { eye: [0, 0, -distance], up: [0, 1, 0] },
        '左视(left)':   { eye: [-distance, 0, 0], up: [0, 1, 0] },
        '右视(right)':  { eye: [distance, 0, 0], up: [0, 1, 0] },
        '上视(top)':    { eye: [0, distance, 0], up: [0, 0, -1] },
        '下视(bottom)': { eye: [0, -distance, 0], up: [0, 0, 1] }
      };

      // 3. 创建离屏渲染器和正交相机(用于 HLR)
      const hlrSize = 512;
      const hlrRenderer = new THREE_NS.WebGLRenderer({ antialias: false, preserveDrawingBuffer: true });
      hlrRenderer.setSize(hlrSize, hlrSize);
      hlrRenderer.setClearColor(0x000000, 1);

      const halfSize = size * 0.6;
      const hlrCamera = new THREE_NS.OrthographicCamera(-halfSize, halfSize, halfSize, -halfSize, 0.1, distance * 3);

      // 4. 对每个视图做 HLR + 投影
      const svgSize = 200;
      const padding = 15;
      let html = `<div style="margin-bottom:8px;color:var(--text-primary);font-weight:600">模型 BBox: X=${(bbox.max.x-bbox.min.x).toFixed(0)} Y=${(bbox.max.y-bbox.min.y).toFixed(0)} Z=${(bbox.max.z-bbox.min.z).toFixed(0)} 总边线=${allEdges.length}</div>`;
      html += '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px">';

      for (const [name, cfg] of Object.entries(viewConfigs)) {
        // 设置相机
        hlrCamera.position.set(center.x + cfg.eye[0], center.y + cfg.eye[1], center.z + cfg.eye[2]);
        hlrCamera.up.set(cfg.up[0], cfg.up[1], cfg.up[2]);
        hlrCamera.lookAt(center.x, center.y, center.z);
        hlrCamera.updateProjectionMatrix();

        // 渲染场景获取深度缓冲
        hlrRenderer.render(scene, hlrCamera);

        // 读取深度缓冲
        const depthBuffer = new Float32Array(hlrSize * hlrSize);
        const gl = hlrRenderer.getContext();
        gl.readPixels(0, 0, hlrSize, hlrSize, gl.DEPTH_COMPONENT, gl.FLOAT, depthBuffer);

        // 计算视图方向向量(用于 2D 投影)
        const dirLen = Math.hypot(cfg.eye[0], cfg.eye[1], cfg.eye[2]);
        const dir = [cfg.eye[0]/dirLen, cfg.eye[1]/dirLen, cfg.eye[2]/dirLen];
        const up = cfg.up;
        const right = [
          dir[1]*up[2] - dir[2]*up[1],
          dir[2]*up[0] - dir[0]*up[2],
          dir[0]*up[1] - dir[1]*up[0]
        ];

        // 投影边线并做 HLR 过滤
        let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
        const visibleEdges = [];
        let hiddenCount = 0;

        for (const edge of allEdges) {
          const mx = (edge.v1[0] + edge.v2[0]) / 2;
          const my = (edge.v1[1] + edge.v2[1]) / 2;
          const mz = (edge.v1[2] + edge.v2[2]) / 2;

          const dx = mx - center.x, dy = my - center.y, dz = mz - center.z;
          const sx = dx*right[0] + dy*right[1] + dz*right[2];
          const sy = dx*up[0] + dy*up[1] + dz*up[2];

          const ndcX = sx / halfSize;
          const ndcY = sy / halfSize;
          const px = Math.floor((ndcX + 1) / 2 * hlrSize);
          const py = Math.floor((1 - ndcY) / 2 * hlrSize);

          if (px < 0 || px >= hlrSize || py < 0 || py >= hlrSize) {
            hiddenCount++;
            continue;
          }

          const depthIdx = py * hlrSize + px;
          const surfaceDepth = depthBuffer[depthIdx];

          const camDirX = dir[0], camDirY = dir[1], camDirZ = dir[2];
          const edgeDepth = dx*camDirX + dy*camDirY + dz*camDirZ + distance;
          const normalizedEdgeDepth = (edgeDepth - hlrCamera.near) / (hlrCamera.far - hlrCamera.near);

          const tolerance = 0.002;
          if (normalizedEdgeDepth > surfaceDepth + tolerance) {
            hiddenCount++;
            continue;
          }

          const sx1 = (edge.v1[0]-center.x)*right[0] + (edge.v1[1]-center.y)*right[1] + (edge.v1[2]-center.z)*right[2];
          const sy1 = (edge.v1[0]-center.x)*up[0] + (edge.v1[1]-center.y)*up[1] + (edge.v1[2]-center.z)*up[2];
          const sx2 = (edge.v2[0]-center.x)*right[0] + (edge.v2[1]-center.y)*right[1] + (edge.v2[2]-center.z)*right[2];
          const sy2 = (edge.v2[0]-center.x)*up[0] + (edge.v2[1]-center.y)*up[1] + (edge.v2[2]-center.z)*up[2];

          minX = Math.min(minX, sx1, sx2);
          minY = Math.min(minY, sy1, sy2);
          maxX = Math.max(maxX, sx1, sx2);
          maxY = Math.max(maxY, sy1, sy2);
          visibleEdges.push({ x1: sx1, y1: sy1, x2: sx2, y2: sy2 });
        }

        const w = maxX - minX, h = maxY - minY;
        const scale = (svgSize - 2*padding) / Math.max(w, h, 1);
        const offsetX = (svgSize - w*scale)/2 - minX*scale;
        const offsetY = (svgSize - h*scale)/2 - minY*scale;

        let svgLines = '';
        for (const p of visibleEdges) {
          const px1 = p.x1*scale + offsetX;
          const py1 = svgSize - (p.y1*scale + offsetY);
          const px2 = p.x2*scale + offsetX;
          const py2 = svgSize - (p.y2*scale + offsetY);
          svgLines += `<line x1="${px1.toFixed(1)}" y1="${py1.toFixed(1)}" x2="${px2.toFixed(1)}" y2="${py2.toFixed(1)}" stroke="#333" stroke-width="0.5"/>`;
        }

        html += `<div style="border:1px solid var(--border-color);border-radius:6px;padding:8px;background:var(--bg-secondary)">`;
        html += `<div style="font-size:12px;color:var(--text-primary);margin-bottom:4px;font-weight:600">${name}</div>`;
        html += `<div style="font-size:10px;color:var(--text-secondary);margin-bottom:6px">${w.toFixed(0)}×${h.toFixed(0)}mm 可见:${visibleEdges.length} 隐藏:${hiddenCount}</div>`;
        html += `<svg width="${svgSize}" height="${svgSize}" style="background:#fff;border-radius:4px">${svgLines}</svg>`;
        html += `</div>`;
      }
      html += '</div>';
      resultEl.innerHTML = html;

      hlrRenderer.dispose();
    } catch (error) {
      resultEl.innerHTML = `<div style="color:var(--error)">提取失败: ${error.message}</div>`;
      console.error(error);
    }
  }

  // 从 Three.js 对象的原型链提取 THREE 命名空间
  function getThreeNamespace(obj) {
    // 方法1: 如果 window.THREE 存在直接用
    if (window.THREE) return window.THREE;
    // 方法2: 从对象的原型链找到 Object3D 类,其模块作用域包含所有 THREE 类
    // 遍历原型链找 constructor
    let current = obj;
    while (current) {
      const ctor = current.constructor;
      if (ctor && ctor.name === 'Object3D') {
        // Object3D 的模块作用域就是 THREE
        // 但无法直接访问模块作用域,改用方法3
        break;
      }
      current = Object.getPrototypeOf(current);
    }
    // 方法3: 从 WebGLRenderer 实例获取
    // renderer 是 WebGLRenderer 实例,其原型链上有 WebGLRenderer -> Renderer -> Object
    // 但同样无法访问模块作用域
    // 方法4: 利用 scene 上挂载的 THREE 内部引用
    // Three.js 的 Scene 对象没有直接引用 THREE 命名空间
    // 最终方案: 从 o3dv 的 OV 对象获取,OV 内部引用了 THREE
    // OV 是 o3dv 的全局对象,它内部使用了 THREE
    // 通过 OV 的任意方法或属性,可以间接获取 THREE
    // 最可靠的方式: 从 renderer 的 properties 获取 gl,然后反推
    // 但实际上最简单的是: o3dv 的 min.js 中 THREE 被打包为模块变量
    // 我们无法直接访问,但可以重新创建所需的类
    // 方案: 不依赖 THREE 命名空间,用原生 WebGL API
    // 但 OrthographicCamera 和 WebGLRenderer 需要 THREE...
    // 最终方案: 从 scene 对象上找 _three 或类似属性
    // 或者从 OV 模块获取
    if (typeof OV !== 'undefined' && OV._THREE) return OV._THREE;
    // 尝试从 OV 模块内部获取
    // OV 是 o3dv 的命名空间,查看其属性
    for (const key of Object.keys(OV)) {
      const val = OV[key];
      if (val && typeof val === 'object' && val.WebGLRenderer && val.Scene) {
        return val;
      }
    }
    // 最后尝试: 从 scene 的 uuid 属性所在的模块获取
    // Three.js 对象都有 uuid,其构造函数在模块作用域中
    // 通过 eval 或 Function 构造器无法访问闭包变量
    // 终极方案: 利用 renderer 的 context 和 Three.js 内部结构
    // renderer.properties 包含 WebGL 上下文信息
    // 但实际上,我们只需要 WebGLRenderer 和 OrthographicCamera
    // 这两个类在 o3dv 的 bundle 中
    // 通过 OV.EmbeddedViewer 或 OV.Viewer 可以间接创建
    // 查看 OV 是否有创建渲染器的方法
    throw new Error('无法获取 THREE 命名空间。o3dv 内部打包了 THREE 但未暴露。请检查 OV 对象是否有 THREE 引用。');
  }

  // 暴露给外部调用
  window.loadModelFromRemoteUrl = loadModelFromRemoteUrl;
  window.loadModel = loadModel;
  window.extractStandardViewEdges = extractStandardViewEdges;
</script>
</body>
</html>
